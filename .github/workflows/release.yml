name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: craftcalc-windows-x64.exe
          # oldest supported Ubuntu runner = widest glibc compatibility
          - os: ubuntu-22.04
            asset: craftcalc-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pytest pytest-asyncio

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: |
          SEP=$(python -c "import os; print(os.pathsep)")
          pyinstaller -y --onefile --name craftcalc \
            --distpath dist --workpath build/work --specpath build \
            --add-data "$PWD/src/xiv_craftcalc/app.tcss${SEP}xiv_craftcalc" \
            --collect-submodules textual --collect-submodules rich \
            packaging/craftcalc.py
          if [ -f dist/craftcalc.exe ]; then mv dist/craftcalc.exe "dist/${{ matrix.asset }}"; else mv dist/craftcalc "dist/${{ matrix.asset }}"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
